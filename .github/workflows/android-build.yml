name: Android build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Prepare verified offline Linux runtime
        run: bash scripts/prepare-linux-runtime.sh
      - name: Verify bundled PRoot launches the real Linux rootfs
        run: bash scripts/verify-linux-runtime.sh
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Verify APK contains its offline Linux and native runtimes
        run: python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Run JVM and Android unit tests
        env:
          ALASER_BUNDLED_ROOTFS: ${{ github.workspace }}/app/src/main/assets/linux/alpine-x86_64.rootfs
        run: gradle test
      - name: Run Android lint
        run: gradle :app:lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: alaser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
